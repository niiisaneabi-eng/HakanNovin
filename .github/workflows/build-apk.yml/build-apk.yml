          package com.hakannovin.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.telephony.SmsManager;

          public class SmsReminderReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context context, Intent intent) {
                  String phone = intent.getStringExtra("phone");
                  String text = intent.getStringExtra("text");
                  String key = intent.getStringExtra("key");
                  if (phone == null || phone.trim().isEmpty() || text == null) return;
                  android.content.SharedPreferences p = context.getSharedPreferences("sms", Context.MODE_PRIVATE);
                  if (key != null && p.getBoolean("sent_" + key, false)) return;
                  try {
                      SmsManager.getDefault().sendTextMessage(phone, null, text, null, null);
                      if (key != null) p.edit().putBoolean("sent_" + key, true).apply();
                  } catch (Exception ignored) { }
              }
          }
