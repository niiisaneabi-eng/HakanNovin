      - name: Download Excel engine
        run: |
          curl -L --fail --retry 3 -o app/src/main/assets/xlsx.full.min.js https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hakannovin/app/MainActivity.java
          test -f app/src/main/java/com/hakannovin/app/SmsReminderReceiver.java
          test -f app/src/main/java/com/hakannovin/app/BootReceiver.java
          test -f app/src/main/java/com/hakannovin/app/XlsxImporter.java

      - name: Verify SMS and Android project
        shell: bash
        run: |
          set -e
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hakannovin/app/MainActivity.java
          test -f app/src/main/java/com/hakannovin/app/SmsReminderReceiver.java
          grep -q "android.permission.SEND_SMS" app/src/main/AndroidManifest.xml
          grep -q "SmsManager" app/src/main/java/com/hakannovin/app/SmsReminderReceiver.java
          grep -q "scheduleSms" app/src/main/assets/index.html
          grep -q "pre3_" app/src/main/assets/index.html
          grep -q "due_" app/src/main/assets/index.html
          grep -q "scheduleCustomer(c)" app/src/main/assets/index.html

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HakanNovin-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
