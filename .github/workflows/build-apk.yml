name: Build HakanNovin APK V3.1

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/hakannovin/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values
          
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HakanNovin"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hakannovin.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.hakannovin.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 31
                  versionName "3.1"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">هاکان نوین</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#087f8c</item>
                  <item name="android:navigationBarColor">#ffffff</item>
                  <item name="android:colorAccent">#087f8c</item>
              </style>
          </resources>
          EOF

      - name: Download SheetJS
        shell: bash
        run: |
          curl -L \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            -o app/src/main/assets/xlsx.full.min.js

      - name: Create MainActivity
        shell: bash
        run: |
          cat > app/src/main/java/com/hakannovin/app/MainActivity.java <<'EOF'
          package com.hakannovin.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView web = new WebView(this);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/index.html");

                  setContentView(web);
              }
          }
          EOF

      - name: Create HakanNovin app
        shell: bash
        run: |
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">

          <title>هاکان نوین</title>

          <script src="xlsx.full.min.js"></script>

          <style>
          *{
            box-sizing:border-box;
            font-family:Tahoma,Arial,sans-serif;
          }

          body{
            margin:0;
            background:#f4f8f9;
            color:#18343a;
          }

          header{
            background:linear-gradient(135deg,#087f8c,#12a6a0);
            color:white;
            padding:22px 18px;
            border-radius:0 0 25px 25px;
            box-shadow:0 4px 15px #0002;
          }

          header h1{
            margin:0;
            font-size:25px;
          }

          header p{
            margin:7px 0 0;
            opacity:.9;
          }

          .container{
            padding:15px;
            max-width:800px;
            margin:auto;
          }

          .stats{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:10px;
            margin-top:-5px;
          }

          .stat{
            background:white;
            padding:16px;
            border-radius:17px;
            box-shadow:0 2px 10px #00000010;
          }

          .stat b{
            display:block;
            font-size:24px;
            color:#087f8c;
            margin-bottom:4px;
          }

          button{
            border:0;
            border-radius:13px;
            padding:13px 16px;
            font-size:15px;
            cursor:pointer;
          }

          .primary{
            background:#087f8c;
            color:white;
          }

          .secondary{
            background:#e2f3f4;
            color:#087f8c;
          }

          .danger{
            background:#ffe5e5;
            color:#b00020;
          }

          .toolbar{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin:15px 0;
          }

          input,select,textarea{
            width:100%;
            border:1px solid #d6e1e3;
            border-radius:12px;
            padding:13px;
            font-size:15px;
            background:white;
          }

          textarea{
            min-height:90px;
            resize:vertical;
          }

          .search{
            margin-bottom:10px;
          }

          .customer{
            background:white;
            border-radius:16px;
            padding:15px;
            margin:9px 0;
            box-shadow:0 2px 9px #0000000d;
          }

          .customer b{
            font-size:17px;
          }

          .muted{
            color:#718488;
            font-size:13px;
            margin-top:5px;
          }

          .actions{
            display:flex;
            gap:7px;
            margin-top:10px;
            flex-wrap:wrap;
          }

          .modal{
            display:none;
            position:fixed;
            inset:0;
            background:#0008;
            z-index:10;
            padding:15px;
            overflow:auto;
          }

          .modalBox{
            background:#fff;
            max-width:700px;
            margin:25px auto;
            border-radius:20px;
            padding:18px;
          }

          .modalBox h2{
            margin-top:0;
          }

          .field{
            margin:10px 0;
          }

          .field label{
            display:block;
            margin-bottom:5px;
            font-size:13px;
            color:#607477;
          }

          .empty{
            text-align:center;
            background:white;
            padding:35px 15px;
            border-radius:17px;
            color:#718488;
          }

          .success{
            background:#e6f8ed;
            color:#157347;
            padding:12px;
            border-radius:12px;
            margin:10px 0;
            display:none;
          }

          .warning{
            background:#fff5dc;
            color:#875f00;
            padding:12px;
            border-radius:12px;
            margin:10px 0;
          }
          </style>
          </head>

          <body>

          <header>
            <h1>💧 هاکان نوین</h1>
            <p>مدیریت مشتریان و سرویس تصفیه آب</p>
          </header>

          <div class="container">

            <div class="stats">
              <div class="stat">
                <b id="total">0</b>
                مشتری
              </div>

              <div class="stat">
                <b id="phones">0</b>
                دارای شماره
              </div>
            </div>

            <div id="message" class="success"></div>

            <div class="toolbar">
              <button class="primary" onclick="openAdd()">➕ مشتری جدید</button>

              <button class="secondary" onclick="document.getElementById('excel').click()">
                📥 ورود اکسل
              </button>

              <input
                id="excel"
                type="file"
                accept=".xlsx,.xls,.csv"
                style="display:none"
                onchange="importExcel(event)"
              />

              <button class="secondary" onclick="exportExcel()">
                📤 خروجی اکسل
              </button>

              <button class="danger" onclick="clearCustomers()">
                🗑 حذف همه مشتریان
              </button>
            </div>

            <input
              id="search"
              class="search"
              placeholder="🔎 جستجوی نام، شماره، آدرس یا دستگاه..."
              oninput="render()"
            />

            <div id="list"></div>

          </div>


          <div id="modal" class="modal">

            <div class="modalBox">

              <h2 id="modalTitle">مشتری جدید</h2>

              <div class="field">
                <label>نام و نام خانوادگی</label>
                <input id="f_name">
              </div>

              <div class="field">
                <label>شماره تماس</label>
                <input id="f_phone" inputmode="tel">
              </div>

              <div class="field">
                <label>آدرس</label>
                <textarea id="f_address"></textarea>
              </div>

              <div class="field">
                <label>نوع دستگاه</label>
                <input id="f_device">
              </div>

              <div class="field">
                <label>تاریخ نصب</label>
                <input id="f_install" placeholder="مثلاً 1404/02/15">
              </div>

              <div class="field">
                <label>آخرین تعویض فیلتر</label>
                <input id="f_filter" placeholder="مثلاً 1404/08/15">
              </div>

              <div class="field">
                <label>تاریخ بعدی</label>
                <input id="f_next" placeholder="مثلاً 1405/02/15">
              </div>

              <div class="field">
                <label>فیلتر ۵ و ۶</label>
                <input id="f_f56">
              </div>

              <div class="field">
                <label>ممبران</label>
                <input id="f_membrane">
              </div>

              <div class="field">
                <label>ملاحظات</label>
                <textarea id="f_notes"></textarea>
              </div>

              <div class="field">
                <label>بدهکاری</label>
                <input id="f_debt">
              </div>

              <div class="actions">
                <button class="primary" onclick="saveCustomer()">ذخیره</button>
                <button class="secondary" onclick="closeModal()">انصراف</button>
              </div>

            </div>

          </div>


          <script>

          let customers = [];

          let editIndex = -1;


          function load(){

            try{
              customers = JSON.parse(
                localStorage.getItem("hakan_novin_customers") || "[]"
              );

              if(!Array.isArray(customers))
                customers=[];

            }catch(e){
              customers=[];
            }

            render();
          }


          function save(){

            localStorage.setItem(
              "hakan_novin_customers",
              JSON.stringify(customers)
            );

            render();
          }


          function showMessage(text){

            const box=document.getElementById("message");

            box.textContent=text;
            box.style.display="block";

            setTimeout(()=>{
              box.style.display="none";
            },4000);
          }


          function openAdd(){

            editIndex=-1;

            document.getElementById("modalTitle").textContent="مشتری جدید";

            [
              "f_name",
              "f_phone",
              "f_address",
              "f_device",
              "f_install",
              "f_filter",
              "f_next",
              "f_f56",
              "f_membrane",
              "f_notes",
              "f_debt"
            ].forEach(id=>{
              document.getElementById(id).value="";
            });

            document.getElementById("modal").style.display="block";
          }


          function closeModal(){

            document.getElementById("modal").style.display="none";
          }


          function saveCustomer(){

            const c={
              name:document.getElementById("f_name").value.trim(),
              phone:document.getElementById("f_phone").value.trim(),
              address:document.getElementById("f_address").value.trim(),
              device:document.getElementById("f_device").value.trim(),
              install:document.getElementById("f_install").value.trim(),
              filter:document.getElementById("f_filter").value.trim(),
              next:document.getElementById("f_next").value.trim(),
              f56:document.getElementById("f_f56").value.trim(),
              membrane:document.getElementById("f_membrane").value.trim(),
              notes:document.getElementById("f_notes").value.trim(),
              debt:document.getElementById("f_debt").value.trim()
            };

            if(!c.name && !c.phone){
              alert("حداقل نام یا شماره تماس را وارد کن.");
              return;
            }

            if(editIndex>=0){
              customers[editIndex]={
                ...customers[editIndex],
                ...c
              };
            }else{
              customers.push(c);
            }

            save();
            closeModal();

            showMessage(
              editIndex>=0
              ? "اطلاعات مشتری ویرایش شد."
              : "مشتری با موفقیت اضافه شد."
            );
          }


          function editCustomer(i){

            const c=customers[i];

            editIndex=i;

            document.getElementById("modalTitle").textContent="ویرایش مشتری";

            document.getElementById("f_name").value=c.name||"";
            document.getElementById("f_phone").value=c.phone||"";
            document.getElementById("f_address").value=c.address||"";
            document.getElementById("f_device").value=c.device||"";
            document.getElementById("f_install").value=c.install||"";
            document.getElementById("f_filter").value=c.filter||"";
            document.getElementById("f_next").value=c.next||"";
            document.getElementById("f_f56").value=c.f56||"";
            document.getElementById("f_membrane").value=c.membrane||"";
            document.getElementById("f_notes").value=c.notes||"";
            document.getElementById("f_debt").value=c.debt||"";

            document.getElementById("modal").style.display="block";
          }


          function deleteCustomer(i){

            if(!confirm("این مشتری حذف شود؟"))
              return;

            customers.splice(i,1);
            save();

            showMessage("مشتری حذف شد.");
          }


          function render(){

            document.getElementById("total").textContent=customers.length;

            document.getElementById("phones").textContent=
              customers.filter(c=>c.phone).length;

            const q=
              document.getElementById("search").value
              .trim()
              .toLowerCase();

            const list=document.getElementById("list");

            const filtered=customers.filter(c=>{

              const text=[
                c.name,
                c.phone,
                c.address,
                c.device,
                c.notes
              ].join(" ").toLowerCase();

              return !q || text.includes(q);
            });

            if(!filtered.length){

              list.innerHTML=
                '<div class="empty">هنوز مشتری‌ای ثبت نشده است.</div>';

              return;
            }

            list.innerHTML=filtered.map(c=>{

              const i=customers.indexOf(c);

              return `
                <div class="customer">

                  <b>${escapeHtml(c.name||"بدون نام")}</b>

                  <div class="muted">
                    📞 ${escapeHtml(c.phone||"بدون شماره")}
                  </div>

                  <div class="muted">
                    📍 ${escapeHtml(c.address||"بدون آدرس")}
                  </div>

                  <div class="muted">
                    💧 ${escapeHtml(c.device||"نوع دستگاه ثبت نشده")}
                  </div>

                  <div class="actions">

                    ${
                      c.phone
                      ?
                      `<button class="secondary"
                        onclick="callCustomer('${escapeAttr(c.phone)}')">
                        📞 تماس
                      </button>`
                      :
                      ""
                    }

                    <button class="secondary"
                      onclick="editCustomer(${i})">
                      ✏️ ویرایش
                    </button>

                    <button class="danger"
                      onclick="deleteCustomer(${i})">
                      حذف
                    </button>

                  </div>

                </div>
              `;

            }).join("");
          }


          function escapeHtml(v){

            return String(v||"")
              .replace(/&/g,"&amp;")
              .replace(/</g,"&lt;")
              .replace(/>/g,"&gt;")
              .replace(/"/g,"&quot;")
              .replace(/'/g,"&#039;");
          }


          function escapeAttr(v){

            return String(v||"").replace(/'/g,"\\'");
          }


          function callCustomer(phone){

            window.location.href="tel:"+phone;
          }


          /*
           * مهم‌ترین اصلاح V3.1:
           * دیگر فقط Sheet[0] خوانده نمی‌شود.
           * تمام شیت‌ها بررسی می‌شوند و اولین شیت دارای
           * اطلاعات واقعی مشتری انتخاب می‌شود.
           */

          function normalizeHeader(v){

            return String(v??"")
              .trim()
              .replace(/\u200c/g,"")
              .replace(/\s+/g,"")
              .replace(/[يى]/g,"ی")
              .replace(/ك/g,"ک")
              .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
          }


          function findColumn(headers,names){

            const wanted=names.map(normalizeHeader);

            for(let i=0;i<headers.length;i++){

              const h=normalizeHeader(headers[i]);

              if(wanted.includes(h))
                return i;
            }

            return -1;
          }


          function convertRow(row,headers){

            const nameCol=findColumn(
              headers,
              [
                "نام و نام خانوادگی",
                "نام مشتری",
                "نام",
                "مشتری"
              ]
            );

            const phoneCol=findColumn(
              headers,
              [
                "شماره تماس",
                "شماره تلفن",
                "تلفن",
                "موبایل",
                "شماره"
              ]
            );

            const addressCol=findColumn(
              headers,
              [
                "آدرس",
                "نشانی"
              ]
            );

            const deviceCol=findColumn(
              headers,
              [
                "نوع دستگاه",
                "دستگاه",
                "مدل دستگاه"
              ]
            );

            const installCol=findColumn(
              headers,
              [
                "تاریخ نصب",
                "تاریخنصب"
              ]
            );

            const filterCol=findColumn(
              headers,
              [
                "تعویض فیلتر",
                "آخرین تعویض فیلتر",
                "تعویضفیلتر"
              ]
            );

            const f56Col=findColumn(
              headers,
              [
                "فیلتر 5و6",
                "فیلتر ۵ و ۶",
                "فیلتر ۵و۶",
                "فیلتر5و6"
              ]
            );

            const nextCol=findColumn(
              headers,
              [
                "تاریخ بعدی",
                "موعد سرویس بعدی",
                "سرویس بعدی"
              ]
            );

            const membraneCol=findColumn(
              headers,
              [
                "ممبران",
                "membrane"
              ]
            );

            const notesCol=findColumn(
              headers,
              [
                "ملاحظات",
                "ملاحضات",
                "توضیحات",
                "یادداشت"
              ]
            );

            const debtCol=findColumn(
              headers,
              [
                "بدهکاری",
                "بدهی"
              ]
            );

            function value(col){

              if(col<0)
                return "";

              return row[col]===undefined || row[col]===null
                ? ""
                : String(row[col]).trim();
            }

            return {

              name:value(nameCol),

              phone:value(phoneCol),

              address:value(addressCol),

              device:value(deviceCol),

              install:value(installCol),

              filter:value(filterCol),

              f56:value(f56Col),

              next:value(nextCol),

              membrane:value(membraneCol),

              notes:value(notesCol),

              debt:value(debtCol),

              imported:true
            };
          }


          function rowLooksLikeCustomer(c){

            return Boolean(
              c.name ||
              c.phone ||
              c.address ||
              c.device ||
              c.install ||
              c.next
            );
          }


          function sheetHasCustomerData(rows){

            if(!rows || !rows.length)
              return false;

            const headers=rows[0]||[];

            const normalized=headers.map(normalizeHeader);

            const hasName=
              normalized.includes(normalizeHeader("نام و نام خانوادگی")) ||
              normalized.includes(normalizeHeader("نام مشتری")) ||
              normalized.includes(normalizeHeader("نام"));

            const hasPhone=
              normalized.includes(normalizeHeader("شماره تماس")) ||
              normalized.includes(normalizeHeader("تلفن")) ||
              normalized.includes(normalizeHeader("شماره تلفن"));

            const hasAddress=
              normalized.includes(normalizeHeader("آدرس"));

            return hasName || hasPhone || hasAddress;
          }


          function importExcel(event){

            const file=event.target.files[0];

            if(!file)
              return;

            const reader=new FileReader();

            reader.onload=function(e){

              try{

                const data=new Uint8Array(e.target.result);

                const workbook=XLSX.read(
                  data,
                  {
                    type:"array",
                    cellDates:false
                  }
                );

                if(!workbook.SheetNames.length){

                  alert("هیچ شیتی در فایل اکسل پیدا نشد.");
                  return;
                }

                let selectedRows=null;
                let selectedSheet="";

                /*
                 * همه شیت‌ها بررسی می‌شوند.
                 * Sheet3 خالی باشد، رد می‌شود.
                 */

                for(const sheetName of workbook.SheetNames){

                  const sheet=workbook.Sheets[sheetName];

                  if(!sheet)
                    continue;

                  const rows=XLSX.utils.sheet_to_json(
                    sheet,
                    {
                      header:1,
                      defval:"",
                      raw:false
                    }
                  );

                  if(sheetHasCustomerData(rows)){

                    selectedRows=rows;
                    selectedSheet=sheetName;

                    break;
                  }
                }

                if(!selectedRows){

                  alert(
                    "در هیچ‌کدام از شیت‌های فایل، ستون‌های مشتری پیدا نشد.\n\n"+
                    "نام ستون‌ها باید شامل نام، شماره تماس یا آدرس باشد."
                  );

                  return;
                }

                const headers=selectedRows[0];

                const imported=[];

                for(let i=1;i<selectedRows.length;i++){

                  const row=selectedRows[i];

                  if(!row)
                    continue;

                  const c=convertRow(row,headers);

                  if(rowLooksLikeCustomer(c))
                    imported.push(c);
                }

                if(!imported.length){

                  alert(
                    "شیت «"+selectedSheet+"» پیدا شد، "+
                    "اما ردیف مشتری قابل خواندن نبود."
                  );

                  return;
                }

                /*
                 * اطلاعات قبلی پاک نمی‌شود.
                 * مشتریان اکسل به لیست فعلی اضافه می‌شوند.
                 */

                customers=customers.concat(imported);

                save();

                alert(
                  "✅ ورود اکسل موفق بود\n\n"+
                  "شیت: "+selectedSheet+"\n"+
                  "تعداد مشتری واردشده: "+imported.length+"\n"+
                  "تعداد کل مشتریان: "+customers.length
                );

                event.target.value="";

              }catch(err){

                console.error(err);

                alert(
                  "خطا در خواندن فایل اکسل:\n"+
                  err.message
                );
              }

            };

            reader.readAsArrayBuffer(file);
          }


          function exportExcel(){

            if(!customers.length){

              alert("هنوز مشتری‌ای برای خروجی وجود ندارد.");
              return;
            }

            const rows=customers.map((c,i)=>({

              "ردیف":i+1,
              "نام و نام خانوادگی":c.name||"",
              "شماره تماس":c.phone||"",
              "آدرس":c.address||"",
              "نوع دستگاه":c.device||"",
              "تاریخ نصب":c.install||"",
              "آخرین تعویض فیلتر":c.filter||"",
              "فیلتر 5و6":c.f56||"",
              "تاریخ بعدی":c.next||"",
              "ممبران":c.membrane||"",
              "ملاحظات":c.notes||"",
              "بدهکاری":c.debt||""

            }));

            const ws=XLSX.utils.json_to_sheet(rows);

            const wb=XLSX.utils.book_new();

            XLSX.utils.book_append_sheet(
              wb,
              ws,
              "مشتریان"
            );

            XLSX.writeFile(
              wb,
              "HakanNovin-Customers.xlsx"
            );
          }


          function clearCustomers(){

            if(!customers.length){
              alert("لیست مشتریان خالی است.");
              return;
            }

            if(!confirm(
              "⚠️ همه مشتریان از برنامه حذف شوند؟\n"+
              "این کار قابل برگشت نیست."
            ))
              return;

            customers=[];

            save();

            showMessage("همه مشتریان حذف شدند.");
          }


          load();

          </script>

          </body>
          </html>
          EOF

      - name: Setup Gradle
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HakanNovin-APK-v3.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
