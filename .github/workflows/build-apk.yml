name: Build HakanNovin APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p hakan/app/src/main/java/com/hakannovin/app
          mkdir -p hakan/app/src/main/res/values

          cat > hakan/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HakanNovin"
          include(":app")
          EOF

          cat > hakan/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > hakan/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > hakan/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hakannovin.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.hakannovin.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName "2.0"
              }
          }
          EOF

          cat > hakan/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="هاکان نوین"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > hakan/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>

              </style>

          </resources>
          EOF

          cat > hakan/app/src/main/java/com/hakannovin/app/MainActivity.java <<'EOF'
          package com.hakannovin.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.widget.*;
          import android.text.*;
          import java.io.*;
          import java.util.*;
          import java.util.zip.*;
          import org.xmlpull.v1.XmlPullParser;
          import android.util.Xml;

          public class MainActivity extends Activity {

              LinearLayout root;
              ArrayList<Customer> customers = new ArrayList<>();

              int dp(int v) {
                  return (int)(v *
                      getResources().getDisplayMetrics().density + 0.5f);
              }

              TextView txt(String value, int size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.rgb(30,30,30));
                  t.setGravity(Gravity.RIGHT |
                      Gravity.CENTER_VERTICAL);
                  t.setPadding(dp(12),dp(8),dp(12),dp(8));
                  return t;
              }

              Button btn(String value) {
                  Button b = new Button(this);
                  b.setText(value);
                  b.setTextSize(15);
                  b.setAllCaps(false);
                  return b;
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  home();
              }

              void home() {

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(
                      dp(16),dp(20),dp(16),dp(16));

                  root.setBackgroundColor(
                      Color.rgb(248,249,251));

                  TextView title = txt(
                      "هاکان نوین",28);

                  title.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD);

                  root.addView(title,
                      new LinearLayout.LayoutParams(
                          -1,dp(60)));

                  root.addView(txt(
                      "مدیریت مشتریان و خدمات تصفیه آب",
                      15));

                  TextView count = txt(
                      "👥 تعداد مشتریان: " +
                      customers.size(),18);

                  count.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD);

                  root.addView(count,
                      new LinearLayout.LayoutParams(
                          -1,dp(60)));

                  Button excel =
                      btn("📊 ورود مشتریان از Excel");

                  excel.setOnClickListener(
                      v -> chooseExcel());

                  root.addView(excel);

                  Button list =
                      btn("👥 لیست مشتریان");

                  list.setOnClickListener(
                      v -> customersList());

                  root.addView(list);

                  Button add =
                      btn("➕ مشتری جدید");

                  add.setOnClickListener(
                      v -> newCustomer());

                  root.addView(add);

                  Button service =
                      btn("🔧 ثبت سرویس");

                  service.setOnClickListener(
                      v -> Toast.makeText(
                          this,
                          "بخش ثبت سرویس در مرحله بعد تکمیل می‌شود",
                          Toast.LENGTH_SHORT).show());

                  root.addView(service);

                  Button search =
                      btn("🔎 جستجوی مشتری");

                  search.setOnClickListener(
                      v -> customersList());

                  root.addView(search);

                  root.addView(txt(
                      "چرخه سرویس دوره‌ای: ۶ ماه\n" +
                      "یادآوری: ۳ روز قبل از موعد\n" +
                      "هاکان نوین - نسخه 2.0",
                      14));

                  setContentView(root);
              }

              void chooseExcel() {

                  Intent i =
                      new Intent(Intent.ACTION_OPEN_DOCUMENT);

                  i.addCategory(
                      Intent.CATEGORY_OPENABLE);

                  i.setType(
                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");

                  startActivityForResult(i,100);
              }

              @Override
              protected void onActivityResult(
                  int request,
                  int result,
                  Intent data) {

                  super.onActivityResult(
                      request,result,data);

                  if(request == 100 &&
                     result == RESULT_OK &&
                     data != null) {

                      try {

                          customers.clear();

                          readExcel(data.getData());

                          Toast.makeText(
                              this,
                              customers.size() +
                              " مشتری وارد شد",
                              Toast.LENGTH_LONG).show();

                          home();

                      } catch(Exception e) {

                          Toast.makeText(
                              this,
                              "خطا در خواندن Excel",
                              Toast.LENGTH_LONG).show();
                      }
                  }
              }

              void readExcel(Uri uri)
                  throws Exception {

                  InputStream input =
                      getContentResolver()
                      .openInputStream(uri);

                  ZipInputStream zip =
                      new ZipInputStream(input);

                  HashMap<String,String> files =
                      new HashMap<>();

                  ZipEntry entry;

                  while((entry =
                      zip.getNextEntry()) != null) {

                      ByteArrayOutputStream out =
                          new ByteArrayOutputStream();

                      byte[] buffer =
                          new byte[8192];

                      int n;

                      while((n =
                          zip.read(buffer)) != -1) {

                          out.write(buffer,0,n);
                      }

                      files.put(
                          entry.getName(),
                          out.toString("UTF-8"));
                  }

                  zip.close();

                  ArrayList<String> shared =
                      sharedStrings(
                          files.get(
                              "xl/sharedStrings.xml"));

                  String sheet =
                      files.get(
                          "xl/worksheets/sheet1.xml");

                  if(sheet == null)
                      throw new Exception();

                  readSheet(sheet,shared);
              }

              ArrayList<String> sharedStrings(
                  String xml) throws Exception {

                  ArrayList<String> result =
                      new ArrayList<>();

                  if(xml == null)
                      return result;

                  XmlPullParser p =
                      Xml.newPullParser();

                  p.setInput(
                      new StringReader(xml));

                  StringBuilder text = null;

                  int event;

                  while((event =
                      p.next()) !=
                      XmlPullParser.END_DOCUMENT) {

                      if(event ==
                         XmlPullParser.START_TAG &&
                         p.getName().equals("si")) {

                          text = new StringBuilder();
                      }

                      else if(event ==
                          XmlPullParser.TEXT &&
                          text != null) {

                          text.append(
                              p.getText());
                      }

                      else if(event ==
                          XmlPullParser.END_TAG &&
                          p.getName().equals("si") &&
                          text != null) {

                          result.add(
                              text.toString());

                          text = null;
                      }
                  }

                  return result;
              }

              void readSheet(
                  String xml,
                  ArrayList<String> shared)
                  throws Exception {

                  XmlPullParser p =
                      Xml.newPullParser();

                  p.setInput(
                      new StringReader(xml));

                  ArrayList<String> row =
                      new ArrayList<>();

                  boolean cell = false;
                  boolean value = false;

                  String type = "";
                  String val = "";

                  int event;

                  while((event =
                      p.next()) !=
                      XmlPullParser.END_DOCUMENT) {

                      if(event ==
                          XmlPullParser.START_TAG) {

                          String name =
                              p.getName();

                          if(name.equals("c")) {

                              cell = true;
                              type =
                                  p.getAttributeValue(
                                      null,"t");

                              val = "";
                          }

                          if(name.equals("v") &&
                             cell) {

                              value = true;
                          }
                      }

                      else if(event ==
                          XmlPullParser.TEXT &&
                          value) {

                          val += p.getText();
                      }

                      else if(event ==
                          XmlPullParser.END_TAG) {

                          String name =
                              p.getName();

                          if(name.equals("v"))
                              value = false;

                          if(name.equals("c")) {

                              String finalValue = val;

                              if("s".equals(type)) {

                                  try {

                                      int index =
                                          Integer.parseInt(val);

                                      if(index >= 0 &&
                                         index < shared.size()) {

                                          finalValue =
                                              shared.get(index);
                                      }

                                  } catch(Exception ignored) {}
                              }

                              row.add(finalValue);
                              cell = false;
                          }

                          if(name.equals("row")) {

                              addRow(row);
                              row =
                                  new ArrayList<>();
                          }
                      }
                  }
              }

              void addRow(
                  ArrayList<String> row) {

                  if(row.size() == 0)
                      return;

                  String name =
                      get(row,0);

                  if(name.contains("نام"))
                      return;

                  Customer c =
                      new Customer();

                  c.name =
                      get(row,0);

                  c.installDate =
                      get(row,1);

                  c.address =
                      get(row,2);

                  c.phone =
                      get(row,3);

                  c.filterDate =
                      get(row,4);

                  c.filter56 =
                      get(row,5);

                  c.nextDate =
                      get(row,6);

                  c.device =
                      get(row,7);

                  c.membrane =
                      get(row,8);

                  c.notes =
                      get(row,9);

                  c.debt =
                      get(row,10);

                  if(c.name.length() > 0 ||
                     c.phone.length() > 0) {

                      customers.add(c);
                  }
              }

              String get(
                  ArrayList<String> row,
                  int index) {

                  if(index >= row.size())
                      return "";

                  return row.get(index).trim();
              }

              void customersList() {

                  LinearLayout page =
                      new LinearLayout(this);

                  page.setOrientation(
                      LinearLayout.VERTICAL);

                  page.setPadding(
                      dp(12),dp(12),
                      dp(12),dp(12));

                  page.addView(
                      txt(
                          "👥 مشتریان: " +
                          customers.size(),
                          22));

                  EditText search =
                      new EditText(this);

                  search.setHint(
                      "نام یا شماره تلفن");

                  search.setSingleLine(true);

                  page.addView(search);

                  ScrollView scroll =
                      new ScrollView(this);

                  LinearLayout list =
                      new LinearLayout(this);

                  list.setOrientation(
                      LinearLayout.VERTICAL);

                  scroll.addView(list);

                  page.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                          -1,0,1));

                  Runnable refresh = () -> {

                      list.removeAllViews();

                      String q =
                          search.getText()
                          .toString()
                          .trim();

                      for(Customer c :
                          customers) {

                          if(q.length() > 0 &&
                             !c.name.contains(q) &&
                             !c.phone.contains(q))
                              continue;

                          Button b =
                              btn(
                                  c.name +
                                  "\n" +
                                  c.phone);

                          b.setOnClickListener(
                              v -> customer(c));

                          list.addView(b);
                      }
                  };

                  search.addTextChangedListener(
                      new TextWatcher() {

                      public void beforeTextChanged(
                          CharSequence s,
                          int a,int b,int c) {}

                      public void onTextChanged(
                          CharSequence s,
                          int a,int b,int c) {

                          refresh.run();
                      }

                      public void afterTextChanged(
                          Editable e) {}
                  });

                  refresh.run();

                  Button back =
                      btn("↩️ برگشت");

                  back.setOnClickListener(
                      v -> home());

                  page.addView(back);

                  setContentView(page);
              }

              void customer(Customer c) {

                  LinearLayout page =
                      new LinearLayout(this);

                  page.setOrientation(
                      LinearLayout.VERTICAL);

                  page.setPadding(
                      dp(16),dp(20),
                      dp(16),dp(16));

                  TextView title =
                      txt(c.name,25);

                  title.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD);

                  page.addView(title);

                  page.addView(txt(
                      "📞 تلفن: " + c.phone,16));

                  page.addView(txt(
                      "📍 آدرس: " + c.address,16));

                  page.addView(txt(
                      "💧 نوع دستگاه: " +
                      c.device,16));

                  page.addView(txt(
                      "📅 تاریخ نصب: " +
                      c.installDate,16));

                  page.addView(txt(
                      "🔧 تعویض فیلتر: " +
                      c.filterDate,16));

                  page.addView(txt(
                      "📅 سرویس بعدی: " +
                      c.nextDate,16));

                  page.addView(txt(
                      "فیلتر ۵ و ۶: " +
                      c.filter56,16));

                  page.addView(txt(
                      "ممبران: " +
                      c.membrane,16));

                  page.addView(txt(
                      "💰 بدهکاری: " +
                      c.debt,16));

                  page.addView(txt(
                      "📝 ملاحظات: " +
                      c.notes,16));

                  Button back =
                      btn("↩️ برگشت");

                  back.setOnClickListener(
                      v -> customersList());

                  page.addView(back);

                  setContentView(page);
              }

              void newCustomer() {

                  Toast.makeText(
                      this,
                      "فرم مشتری جدید در مرحله بعد اضافه می‌شود",
                      Toast.LENGTH_LONG).show();
              }

              static class Customer {

                  String name = "";
                  String installDate = "";
                  String address = "";
                  String phone = "";
                  String filterDate = "";
                  String filter56 = "";
                  String nextDate = "";
                  String device = "";
                  String membrane = "";
                  String notes = "";
                  String debt = "";
              }
          }
          EOF

          cd hakan

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip

          export PATH="$PWD/gradle-8.7/bin:$PATH"

          gradle wrapper --gradle-version 8.7

          ./gradlew assembleDebug

      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "Checking APK..."

          ls -lh hakan/app/build/outputs/apk/debug/

          test -f hakan/app/build/outputs/apk/debug/app-debug.apk

          echo "APK FOUND:"
          ls -lh hakan/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HakanNovin-APK-v2
          path: hakan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
