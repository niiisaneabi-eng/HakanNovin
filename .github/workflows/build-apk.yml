name: Build HakanNovin APK V3.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # Create Android project
      # ---------------------------------------------------------
      - name: Create Android project
        shell: bash
        run: |

          mkdir -p app/src/main/java/com/hakannovin/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HakanNovin"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hakannovin.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.hakannovin.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 32
                  versionName "3.2"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">هاکان نوین</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#087F8C</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:colorAccent">#087F8C</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ---------------------------------------------------------
      # Download SheetJS
      # ---------------------------------------------------------
      - name: Download SheetJS
        shell: bash
        run: |

          curl -L --fail \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            -o app/src/main/assets/xlsx.full.min.js

      # ---------------------------------------------------------
      # Android MainActivity
      # IMPORTANT:
      # V3.2 adds WebChromeClient + onShowFileChooser
      # so the Android file picker actually opens.
      # ---------------------------------------------------------
      - name: Create MainActivity
        shell: bash
        run: |

          cat > app/src/main/java/com/hakannovin/app/MainActivity.java <<'EOF'
          package com.hakannovin.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private static final int FILE_CHOOSER_REQUEST = 1001;

              private ValueCallback<Uri[]> filePathCallback;

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setDatabaseEnabled(true);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {

                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }

                          MainActivity.this.filePathCallback = filePathCallback;

                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);

                          intent.addCategory(Intent.CATEGORY_OPENABLE);

                          intent.setType("*/*");

                          intent.putExtra(
                                  Intent.EXTRA_MIME_TYPES,
                                  new String[] {
                                          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                                          "application/vnd.ms-excel",
                                          "text/csv",
                                          "application/csv",
                                          "text/comma-separated-values"
                                  }
                          );

                          startActivityForResult(
                                  Intent.createChooser(
                                          intent,
                                          "انتخاب فایل Excel"
                                  ),
                                  FILE_CHOOSER_REQUEST
                          );

                          return true;
                      }
                  });

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );

                  setContentView(webView);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode != FILE_CHOOSER_REQUEST) {
                      return;
                  }

                  if (filePathCallback == null) {
                      return;
                  }

                  Uri[] results = null;

                  if (resultCode == Activity.RESULT_OK && data != null) {

                      Uri uri = data.getData();

                      if (uri != null) {
                          results = new Uri[]{uri};
                      }
                  }

                  filePathCallback.onReceiveValue(results);

                  filePathCallback = null;
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # ---------------------------------------------------------
      # Create HTML application
      # ---------------------------------------------------------
      - name: Create HakanNovin V3.2
        shell: bash
        run: |

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>

          <html lang="fa" dir="rtl">

          <head>

          <meta charset="UTF-8">

          <meta
              name="viewport"
              content="width=device-width,initial-scale=1,maximum-scale=1"
          >

          <meta
              name="theme-color"
              content="#087F8C"
          >

          <title>هاکان نوین</title>

          <script src="xlsx.full.min.js"></script>

          <style>

          *{
              box-sizing:border-box;
              font-family:
                  Tahoma,
                  Arial,
                  sans-serif;
          }

          body{
              margin:0;
              background:#F3F8F9;
              color:#17373C;
          }

          header{
              background:
                  linear-gradient(
                      135deg,
                      #087F8C,
                      #12A6A0
                  );

              color:white;

              padding:
                  24px
                  18px
                  28px;

              border-radius:
                  0
                  0
                  28px
                  28px;

              box-shadow:
                  0
                  5px
                  18px
                  rgba(0,0,0,.14);
          }

          header .logo{
              width:58px;
              height:58px;

              display:flex;
              align-items:center;
              justify-content:center;

              background:
                  rgba(255,255,255,.18);

              border:
                  1px solid
                  rgba(255,255,255,.3);

              border-radius:18px;

              font-size:31px;

              margin-bottom:12px;
          }

          header h1{
              margin:0;
              font-size:25px;
          }

          header p{
              margin:
                  7px
                  0
                  0;

              opacity:.9;
              font-size:14px;
          }

          .container{
              width:100%;
              max-width:850px;
              margin:auto;
              padding:15px;
          }

          .stats{
              display:grid;
              grid-template-columns:
                  repeat(2,1fr);

              gap:10px;

              margin-top:-4px;
          }

          .stat{
              background:white;

              border-radius:18px;

              padding:16px;

              box-shadow:
                  0
                  3px
                  12px
                  rgba(0,0,0,.07);
          }

          .stat b{
              display:block;

              color:#087F8C;

              font-size:25px;

              margin-bottom:5px;
          }

          .toolbar{
              display:grid;

              grid-template-columns:
                  repeat(2,1fr);

              gap:9px;

              margin:
                  15px
                  0
                  10px;
          }

          button{
              border:0;

              border-radius:14px;

              padding:
                  13px
                  12px;

              font-size:14px;

              min-height:47px;

              cursor:pointer;
          }

          .primary{
              background:#087F8C;
              color:white;
          }

          .secondary{
              background:#DFF2F3;
              color:#087F8C;
          }

          .danger{
              background:#FFE5E5;
              color:#A40020;
          }

          .search{
              width:100%;

              border:
                  1px solid
                  #D8E4E6;

              background:white;

              border-radius:14px;

              padding:
                  14px;

              font-size:15px;

              outline:none;

              margin:
                  5px
                  0
                  10px;
          }

          .search:focus{
              border-color:#087F8C;
          }

          .customer{
              background:white;

              border-radius:17px;

              padding:15px;

              margin:
                  9px
                  0;

              box-shadow:
                  0
                  3px
                  12px
                  rgba(0,0,0,.06);
          }

          .customer-name{
              font-size:17px;
              font-weight:bold;
          }

          .info{
              color:#667D81;

              font-size:13px;

              margin-top:6px;

              line-height:1.8;
          }

          .actions{
              display:flex;

              gap:7px;

              flex-wrap:wrap;

              margin-top:10px;
          }

          .actions button{
              min-height:40px;
              padding:9px 12px;
          }

          .empty{
              text-align:center;

              background:white;

              border-radius:18px;

              padding:35px 15px;

              color:#718487;
          }

          .message{
              display:none;

              padding:13px;

              background:#E4F8EB;

              color:#176B3A;

              border-radius:14px;

              margin:
                  10px
                  0;
          }

          .modal{
              display:none;

              position:fixed;

              inset:0;

              background:
                  rgba(0,0,0,.72);

              z-index:100;

              padding:14px;

              overflow:auto;
          }

          .modal-box{
              background:white;

              max-width:720px;

              margin:
                  20px
                  auto;

              border-radius:22px;

              padding:18px;
          }

          .modal-box h2{
              margin-top:0;
          }

          .field{
              margin:
                  10px
                  0;
          }

          .field label{
              display:block;

              font-size:13px;

              color:#63777A;

              margin-bottom:5px;
          }

          .field input,
          .field textarea{
              width:100%;

              border:
                  1px solid
                  #D8E4E6;

              border-radius:12px;

              padding:13px;

              font-size:15px;

              background:white;

              outline:none;
          }

          .field textarea{
              min-height:80px;
              resize:vertical;
          }

          .modal-actions{
              display:flex;

              gap:8px;

              margin-top:15px;
          }

          .modal-actions button{
              flex:1;
          }

          .import-box{
              background:#F0FAFA;

              border:
                  1px solid
                  #D0EEEE;

              border-radius:16px;

              padding:13px;

              margin:
                  10px
                  0;

              font-size:13px;

              line-height:1.9;
          }

          .version{
              text-align:center;

              color:#9AAEB1;

              font-size:11px;

              margin:
                  25px
                  0;
          }

          </style>

          </head>


          <body>

          <header>

              <div class="logo">
                  💧
              </div>

              <h1>
                  هاکان نوین
              </h1>

              <p>
                  مدیریت مشتریان و سرویس تصفیه آب
              </p>

          </header>


          <div class="container">

              <div class="stats">

                  <div class="stat">

                      <b id="total">
                          0
                      </b>

                      مشتری
                  </div>

                  <div class="stat">

                      <b id="phoneCount">
                          0
                      </b>

                      دارای شماره
                  </div>

              </div>


              <div
                  id="message"
                  class="message">
              </div>


              <div class="toolbar">

                  <button
                      class="primary"
                      onclick="openAdd()">

                      ➕ مشتری جدید

                  </button>


                  <button
                      class="secondary"
                      onclick="openExcelPicker()">

                      📥 ورود Excel

                  </button>


                  <!--
                      This input is intentionally hidden.
                      Android V3.2 MainActivity handles
                      the file chooser.
                  -->

                  <input
                      id="excelInput"
                      type="file"
                      accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv"
                      style="display:none"
                  >


                  <button
                      class="secondary"
                      onclick="exportExcel()">

                      📤 خروجی Excel

                  </button>


                  <button
                      class="danger"
                      onclick="clearCustomers()">

                      🗑 حذف همه

                  </button>

              </div>


              <div class="import-box">

                  📌
                  برای ورود اطلاعات، روی
                  <b>«ورود Excel»</b>
                  بزن و فایل Excel را از گوشی انتخاب کن.

                  <br>

                  برنامه تمام شیت‌های فایل را بررسی می‌کند و
                  شیتی که اطلاعات مشتری داشته باشد را پیدا می‌کند.

              </div>


              <input
                  id="search"
                  class="search"
                  placeholder="🔎 جستجوی نام، شماره، آدرس یا دستگاه..."
              >


              <div id="list"></div>


              <div class="version">
                  Hakan Novin V3.2
              </div>

          </div>


          <!-- ================================================= -->
          <!-- CUSTOMER MODAL -->
          <!-- ================================================= -->

          <div
              id="customerModal"
              class="modal">

              <div class="modal-box">

                  <h2 id="modalTitle">
                      مشتری جدید
                  </h2>


                  <div class="field">
                      <label>
                          نام و نام خانوادگی
                      </label>

                      <input id="f_name">
                  </div>


                  <div class="field">
                      <label>
                          شماره تماس
                      </label>

                      <input
                          id="f_phone"
                          inputmode="tel">
                  </div>


                  <div class="field">
                      <label>
                          آدرس
                      </label>

                      <textarea id="f_address"></textarea>
                  </div>


                  <div class="field">
                      <label>
                          نوع دستگاه
                      </label>

                      <input id="f_device">
                  </div>


                  <div class="field">
                      <label>
                          تاریخ نصب
                      </label>

                      <input
                          id="f_install"
                          placeholder="مثلاً 1404/02/15">
                  </div>


                  <div class="field">
                      <label>
                          آخرین تعویض فیلتر
                      </label>

                      <input
                          id="f_filter"
                          placeholder="مثلاً 1404/08/15">
                  </div>


                  <div class="field">
                      <label>
                          تاریخ بعدی
                      </label>

                      <input
                          id="f_next"
                          placeholder="مثلاً 1405/02/15">
                  </div>


                  <div class="field">
                      <label>
                          فیلتر ۵ و ۶
                      </label>

                      <input id="f_f56">
                  </div>


                  <div class="field">
                      <label>
                          ممبران
                      </label>

                      <input id="f_membrane">
                  </div>


                  <div class="field">
                      <label>
                          ملاحظات
                      </label>

                      <textarea id="f_notes"></textarea>
                  </div>


                  <div class="field">
                      <label>
                          بدهکاری
                      </label>

                      <input id="f_debt">
                  </div>


                  <div class="modal-actions">

                      <button
                          class="primary"
                          onclick="saveCustomer()">

                          💾 ذخیره

                      </button>

                      <button
                          class="secondary"
                          onclick="closeModal()">

                          انصراف

                      </button>

                  </div>

              </div>

          </div>


          <script>

          /*
           * =====================================================
           * HAKAN NOVIN V3.2
           * =====================================================
           */


          let customers = [];

          let editIndex = -1;


          const STORAGE_KEY =
              "hakan_novin_customers_v32";


          /*
           * =====================================================
           * LOAD
           * =====================================================
           */

          function loadCustomers(){

              try{

                  const old =
                      localStorage.getItem(
                          STORAGE_KEY
                      );

                  if(old){

                      customers =
                          JSON.parse(old);

                      if(!Array.isArray(customers)){
                          customers=[];
                      }

                  }else{

                      /*
                       * If V3.1 already had data,
                       * migrate it automatically.
                       */

                      const previous =
                          localStorage.getItem(
                              "hakan_novin_customers"
                          );

                      if(previous){

                          customers =
                              JSON.parse(previous);

                          if(!Array.isArray(customers)){
                              customers=[];
                          }

                          saveCustomers();
                      }

                  }

              }catch(error){

                  console.error(error);

                  customers=[];

              }

              render();
          }


          function saveCustomers(){

              localStorage.setItem(
                  STORAGE_KEY,
                  JSON.stringify(customers)
              );

          }


          /*
           * =====================================================
           * MESSAGE
           * =====================================================
           */

          function showMessage(text){

              const box =
                  document.getElementById(
                      "message"
                  );

              box.textContent=text;

              box.style.display="block";

              setTimeout(
                  function(){

                      box.style.display="none";

                  },
                  4500
              );
          }


          /*
           * =====================================================
           * CUSTOMER MODAL
           * =====================================================
           */

          function openAdd(){

              editIndex=-1;

              document.getElementById(
                  "modalTitle"
              ).textContent =
                  "مشتری جدید";

              const fields=[
                  "f_name",
                  "f_phone",
                  "f_address",
                  "f_device",
                  "f_install",
                  "f_filter",
                  "f_next",
                  "f_f56",
                  "f_membrane",
                  "f_notes",
                  "f_debt"
              ];

              fields.forEach(
                  function(id){

                      document.getElementById(
                          id
                      ).value="";

                  }
              );

              document.getElementById(
                  "customerModal"
              ).style.display="block";
          }


          function closeModal(){

              document.getElementById(
                  "customerModal"
              ).style.display="none";
          }


          function saveCustomer(){

              const customer={

                  name:
                      document.getElementById(
                          "f_name"
                      ).value.trim(),

                  phone:
                      document.getElementById(
                          "f_phone"
                      ).value.trim(),

                  address:
                      document.getElementById(
                          "f_address"
                      ).value.trim(),

                  device:
                      document.getElementById(
                          "f_device"
                      ).value.trim(),

                  install:
                      document.getElementById(
                          "f_install"
                      ).value.trim(),

                  filter:
                      document.getElementById(
                          "f_filter"
                      ).value.trim(),

                  next:
                      document.getElementById(
                          "f_next"
                      ).value.trim(),

                  f56:
                      document.getElementById(
                          "f_f56"
                      ).value.trim(),

                  membrane:
                      document.getElementById(
                          "f_membrane"
                      ).value.trim(),

                  notes:
                      document.getElementById(
                          "f_notes"
                      ).value.trim(),

                  debt:
                      document.getElementById(
                          "f_debt"
                      ).value.trim()
              };


              if(
                  !customer.name &&
                  !customer.phone
              ){

                  alert(
                      "حداقل نام یا شماره تماس را وارد کن."
                  );

                  return;
              }


              if(editIndex>=0){

                  customers[editIndex]={
                      ...customers[editIndex],
                      ...customer
                  };

                  showMessage(
                      "اطلاعات مشتری ویرایش شد."
                  );

              }else{

                  customers.push(
                      customer
                  );

                  showMessage(
                      "مشتری با موفقیت اضافه شد."
                  );
              }


              saveCustomers();

              render();

              closeModal();
          }


          function editCustomer(index){

              const c =
                  customers[index];

              if(!c)
                  return;

              editIndex=index;

              document.getElementById(
                  "modalTitle"
              ).textContent =
                  "ویرایش مشتری";


              document.getElementById(
                  "f_name"
              ).value =
                  c.name || "";


              document.getElementById(
                  "f_phone"
              ).value =
                  c.phone || "";


              document.getElementById(
                  "f_address"
              ).value =
                  c.address || "";


              document.getElementById(
                  "f_device"
              ).value =
                  c.device || "";


              document.getElementById(
                  "f_install"
              ).value =
                  c.install || "";


              document.getElementById(
                  "f_filter"
              ).value =
                  c.filter || "";


              document.getElementById(
                  "f_next"
              ).value =
                  c.next || "";


              document.getElementById(
                  "f_f56"
              ).value =
                  c.f56 || "";


              document.getElementById(
                  "f_membrane"
              ).value =
                  c.membrane || "";


              document.getElementById(
                  "f_notes"
              ).value =
                  c.notes || "";


              document.getElementById(
                  "f_debt"
              ).value =
                  c.debt || "";


              document.getElementById(
                  "customerModal"
              ).style.display="block";
          }


          function deleteCustomer(index){

              if(
                  !confirm(
                      "این مشتری حذف شود؟"
                  )
              ){
                  return;
              }

              customers.splice(
                  index,
                  1
              );

              saveCustomers();

              render();

              showMessage(
                  "مشتری حذف شد."
              );
          }


          /*
           * =====================================================
           * SEARCH + RENDER
           * =====================================================
           */

          document
              .getElementById("search")
              .addEventListener(
                  "input",
                  render
              );


          function render(){

              document.getElementById(
                  "total"
              ).textContent =
                  customers.length;


              document.getElementById(
                  "phoneCount"
              ).textContent =
                  customers.filter(
                      function(c){
                          return Boolean(c.phone);
                      }
                  ).length;


              const query =
                  document.getElementById(
                      "search"
                  ).value
                  .trim()
                  .toLowerCase();


              const list =
                  document.getElementById(
                      "list"
                  );


              const filtered =
                  customers.filter(
                      function(c){

                          const text=[
                              c.name,
                              c.phone,
                              c.address,
                              c.device,
                              c.notes
                          ]
                          .join(" ")
                          .toLowerCase();

                          return (
                              !query ||
                              text.includes(query)
                          );
                      }
                  );


              if(!filtered.length){

                  list.innerHTML =
                      `
                      <div class="empty">
                          هنوز مشتری‌ای پیدا نشد.
                      </div>
                      `;

                  return;
              }


              list.innerHTML =
                  filtered
                  .map(
                      function(c){

                          const index =
                              customers.indexOf(c);

                          return `

                          <div class="customer">

                              <div class="customer-name">
                                  ${escapeHtml(
                                      c.name ||
                                      "بدون نام"
                                  )}
                              </div>

                              <div class="info">

                                  📞
                                  ${escapeHtml(
                                      c.phone ||
                                      "بدون شماره"
                                  )}

                                  <br>

                                  📍
                                  ${escapeHtml(
                                      c.address ||
                                      "بدون آدرس"
                                  )}

                                  <br>

                                  💧
                                  ${escapeHtml(
                                      c.device ||
                                      "نوع دستگاه ثبت نشده"
                                  )}

                                  ${
                                      c.next
                                      ?
                                      `<br>🗓 سرویس بعدی:
                                      ${escapeHtml(c.next)}`
                                      :
                                      ""
                                  }

                              </div>


                              <div class="actions">

                                  ${
                                      c.phone
                                      ?
                                      `
                                      <button
                                          class="secondary"
                                          onclick="callCustomer('${escapeAttr(c.phone)}')">

                                          📞 تماس

                                      </button>
                                      `
                                      :
                                      ""
                                  }


                                  <button
                                      class="secondary"
                                      onclick="editCustomer(${index})">

                                      ✏️ ویرایش

                                  </button>


                                  <button
                                      class="danger"
                                      onclick="deleteCustomer(${index})">

                                      حذف

                                  </button>

                              </div>

                          </div>

                          `;
                      }
                  )
                  .join("");
          }


          function escapeHtml(value){

              return String(value || "")
                  .replace(/&/g,"&amp;")
                  .replace(/</g,"&lt;")
                  .replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;")
                  .replace(/'/g,"&#039;");
          }


          function escapeAttr(value){

              return String(value || "")
                  .replace(/\\/g,"\\\\")
                  .replace(/'/g,"\\'");
          }


          function callCustomer(phone){

              window.location.href =
                  "tel:" + phone;
          }


          /*
           * =====================================================
           * EXCEL FILE PICKER
           * =====================================================
           */

          function openExcelPicker(){

              const input =
                  document.getElementById(
                      "excelInput"
                  );

              /*
               * Reset value first.
               * This allows selecting the same file again.
               */

              input.value="";

              input.click();
          }


          document
              .getElementById("excelInput")
              .addEventListener(
                  "change",
                  function(event){

                      if(
                          event.target.files &&
                          event.target.files.length
                      ){

                          importExcelFile(
                              event.target.files[0]
                          );
                      }

                  }
              );


          /*
           * =====================================================
           * PERSIAN NORMALIZATION
           * =====================================================
           */

          function normalizeText(value){

              return String(value ?? "")
                  .trim()
                  .replace(/\u200c/g,"")
                  .replace(/[يى]/g,"ی")
                  .replace(/ك/g,"ک")
                  .replace(/[۰-۹]/g,
                      function(d){
                          return
                              "۰۱۲۳۴۵۶۷۸۹"
                              .indexOf(d);
                      }
                  )
                  .replace(/\s+/g,"")
                  .toLowerCase();
          }


          /*
           * =====================================================
           * CELL VALUE
           * =====================================================
           */

          function cellValue(value){

              if(
                  value === undefined ||
                  value === null
              ){
                  return "";
              }

              let result =
                  String(value).trim();

              /*
               * Excel sometimes returns phone
               * numbers such as 9301234567.0
               */

              if(
                  /^\d{9,12}\.0$/.test(result)
              ){

                  result =
                      result.substring(
                          0,
                          result.length-2
                      );
              }


              /*
               * If phone has 9xxxxxxxxx
               * add the leading zero.
               */

              if(
                  /^9\d{9}$/.test(result)
              ){

                  result =
                      "0" + result;
              }


              return result;
          }


          /*
           * =====================================================
           * COLUMN ALIASES
           * =====================================================
           */

          const ALIASES={

              name:[
                  "نام و نام خانوادگی",
                  "نام مشتری",
                  "نام",
                  "مشتری"
              ],

              phone:[
                  "شماره تماس",
                  "شماره تلفن",
                  "تلفن",
                  "موبایل",
                  "شماره"
              ],

              address:[
                  "آدرس",
                  "نشانی"
              ],

              device:[
                  "نوع دستگاه",
                  "مدل دستگاه",
                  "دستگاه",
                  "مدل"
              ],

              install:[
                  "تاریخ نصب"
              ],

              filter:[
                  "تعویض فیلتر",
                  "آخرین تعویض فیلتر"
              ],

              f56:[
                  "فیلتر 5و6",
                  "فیلتر ۵و۶",
                  "فیلتر ۵ و ۶",
                  "فیلتر5و6"
              ],

              next:[
                  "تاریخ بعدی",
                  "موعد سرویس بعدی",
                  "سرویس بعدی"
              ],

              membrane:[
                  "ممبران"
              ],

              notes:[
                  "ملاحظات",
                  "ملاحضات",
                  "توضیحات",
                  "یادداشت"
              ],

              debt:[
                  "بدهکاری",
                  "بدهی"
              ]
          };


          function findColumn(
              headers,
              aliases
          ){

              const wanted =
                  aliases.map(
                      normalizeText
                  );


              for(
                  let i=0;
                  i<headers.length;
                  i++
              ){

                  const header =
                      normalizeText(
                          headers[i]
                      );


                  if(
                      wanted.includes(header)
                  ){
                      return i;
                  }
              }


              return -1;
          }


          /*
           * =====================================================
           * FIND HEADER ROW
           * =====================================================
           *
           * We don't assume the header is row 1.
           * First 20 rows are checked.
           */

          function findHeaderRow(rows){

              let bestIndex=-1;
              let bestScore=0;


              const max =
                  Math.min(
                      rows.length,
                      20
                  );


              for(
                  let r=0;
                  r<max;
                  r++
              ){

                  const row =
                      rows[r] || [];


                  let score=0;


                  const normalized =
                      row.map(
                          normalizeText
                      );


                  Object.keys(ALIASES)
                      .forEach(
                          function(key){

                              const aliases =
                                  ALIASES[key]
                                  .map(
                                      normalizeText
                                  );


                              if(
                                  normalized.some(
                                      function(h){
                                          return aliases.includes(h);
                                      }
                                  )
                              ){
                                  score++;
                              }

                          }
                      );


                  if(score>bestScore){

                      bestScore=score;

                      bestIndex=r;
                  }
              }


              /*
               * At least two recognizable
               * customer columns required.
               */

              if(bestScore>=2){
                  return bestIndex;
              }


              return -1;
          }


          /*
           * =====================================================
           * CONVERT EXCEL ROW
           * =====================================================
           */

          function convertExcelRow(
              row,
              headers
          ){

              function get(key){

                  const col =
                      findColumn(
                          headers,
                          ALIASES[key]
                      );

                  if(col<0)
                      return "";

                  return cellValue(
                      row[col]
                  );
              }


              return {

                  name:get("name"),

                  phone:get("phone"),

                  address:get("address"),

                  device:get("device"),

                  install:get("install"),

                  filter:get("filter"),

                  f56:get("f56"),

                  next:get("next"),

                  membrane:get("membrane"),

                  notes:get("notes"),

                  debt:get("debt"),

                  imported:true
              };
          }


          function isCustomerRow(customer){

              return Boolean(
                  customer.name ||
                  customer.phone ||
                  customer.address ||
                  customer.device
              );
          }


          /*
           * =====================================================
           * SCORE SHEET
           * =====================================================
           */

          function scoreSheet(
              sheetName,
              rows
          ){

              if(
                  !rows ||
                  !rows.length
              ){
                  return {
                      score:0,
                      headerIndex:-1
                  };
              }


              const headerIndex =
                  findHeaderRow(rows);


              if(headerIndex<0){

                  return {
                      score:0,
                      headerIndex:-1
                  };
              }


              const headers =
                  rows[headerIndex] || [];


              let score=0;


              const normalizedName =
                  normalizeText(
                      sheetName
                  );


              /*
               * Prefer the actual customer sheets
               * from the user's workbook.
               */

              if(
                  normalizedName ===
                  normalizeText("مشتري")
              ){
                  score+=100;
              }


              if(
                  normalizedName ===
                  normalizeText("هاکان نوین")
              ){
                  score+=90;
              }


              /*
               * Count recognized columns.
               */

              Object.keys(ALIASES)
                  .forEach(
                      function(key){

                          if(
                              findColumn(
                                  headers,
                                  ALIASES[key]
                              )>=0
                          ){
                              score+=5;
                          }

                      }
                  );


              /*
               * More populated rows = slightly
               * stronger candidate.
               */

              let populated=0;


              for(
                  let i=headerIndex+1;
                  i<rows.length;
                  i++
              ){

                  const row =
                      rows[i] || [];


                  if(
                      row.some(
                          function(x){
                              return String(
                                  x ?? ""
                              ).trim() !== "";
                          }
                      )
                  ){
                      populated++;
                  }

              }


              score +=
                  Math.min(
                      populated,
                      20
                  );


              return {
                  score:score,
                  headerIndex:headerIndex
              };
          }


          /*
           * =====================================================
           * IMPORT EXCEL
           * =====================================================
           */

          function importExcelFile(file){

              if(!file){

                  alert(
                      "فایلی انتخاب نشده است."
                  );

                  return;
              }


              showMessage(
                  "⏳ در حال خواندن فایل Excel..."
              );


              const reader =
                  new FileReader();


              reader.onload =
                  function(event){

                      try{

                          const data =
                              new Uint8Array(
                                  event.target.result
                              );


                          const workbook =
                              XLSX.read(
                                  data,
                                  {
                                      type:"array",
                                      cellDates:false,
                                      raw:false
                                  }
                              );


                          if(
                              !workbook.SheetNames ||
                              !workbook.SheetNames.length
                          ){

                              alert(
                                  "هیچ شیتی در فایل پیدا نشد."
                              );

                              return;
                          }


                          /*
                           * Find the best customer sheet.
                           */

                          let bestSheet=null;


                          workbook.SheetNames
                              .forEach(
                                  function(sheetName){

                                      const worksheet =
                                          workbook.Sheets[
                                              sheetName
                                          ];


                                      if(!worksheet)
                                          return;


                                      const rows =
                                          XLSX.utils.sheet_to_json(
                                              worksheet,
                                              {
                                                  header:1,
                                                  defval:"",
                                                  raw:false
                                              }
                                          );


                                      const result =
                                          scoreSheet(
                                              sheetName,
                                              rows
                                          );


                                      if(
                                          result.score>0 &&
                                          (
                                              bestSheet===null ||
                                              result.score >
                                              bestSheet.score
                                          )
                                      ){

                                          bestSheet={

                                              name:
                                                  sheetName,

                                              rows:
                                                  rows,

                                              score:
                                                  result.score,

                                              headerIndex:
                                                  result.headerIndex

                                          };
                                      }

                                  }
                              );


                          if(!bestSheet){

                              alert(
                                  "❌ هیچ شیت مشتری در فایل پیدا نشد.\n\n"+
                                  "باید حداقل ستون‌هایی مثل «نام»، «شماره تماس» یا «آدرس» وجود داشته باشد."
                              );

                              return;
                          }


                          const headers =
                              bestSheet.rows[
                                  bestSheet.headerIndex
                              ];


                          const imported=[];


                          for(
                              let i=
                                  bestSheet.headerIndex+1;
                              i<
                                  bestSheet.rows.length;
                              i++
                          ){

                              const row =
                                  bestSheet.rows[i];


                              if(!row)
                                  continue;


                              const customer =
                                  convertExcelRow(
                                      row,
                                      headers
                                  );


                              /*
                               * Ignore completely blank rows.
                               */

                              if(
                                  isCustomerRow(
                                      customer
                                  )
                              ){

                                  imported.push(
                                      customer
                                  );
                              }

                          }


                          if(!imported.length){

                              alert(
                                  "شیت «"+
                                  bestSheet.name+
                                  "» پیدا شد، اما ردیف مشتری قابل خواندن نبود."
                              );

                              return;
                          }


                          /*
                           * IMPORTANT:
                           *
                           * Existing customers are not deleted.
                           * Source duplicates are preserved.
                           */

                          const previousCount =
                              customers.length;


                          customers =
                              customers.concat(
                                  imported
                              );


                          saveCustomers();

                          render();


                          alert(

                              "✅ ورود Excel موفق بود\n\n"+

                              "📄 شیت انتخاب‌شده: "+
                              bestSheet.name+
                              "\n\n"+

                              "👤 مشتری واردشده: "+
                              imported.length+
                              "\n\n"+

                              "📊 تعداد کل مشتریان: "+
                              customers.length

                          );


                          showMessage(
                              "✅ "+

                              imported.length+

                              " مشتری از Excel وارد شد."
                          );


                      }catch(error){

                          console.error(
                              "Excel import error:",
                              error
                          );


                          alert(
                              "❌ خطا در خواندن Excel\n\n"+
                              error.message
                          );
                      }

                  };


              reader.onerror =
                  function(){

                      alert(
                          "❌ برنامه نتوانست فایل را بخواند."
                      );

                  };


              reader.readAsArrayBuffer(
                  file
              );
          }


          /*
           * =====================================================
           * EXPORT EXCEL
           * =====================================================
           */

          function exportExcel(){

              if(!customers.length){

                  alert(
                      "هیچ مشتری‌ای برای خروجی وجود ندارد."
                  );

                  return;
              }


              const rows =
                  customers.map(
                      function(c,index){

                          return {

                              "ردیف":
                                  index+1,

                              "نام و نام خانوادگی":
                                  c.name || "",

                              "شماره تماس":
                                  c.phone || "",

                              "آدرس":
                                  c.address || "",

                              "نوع دستگاه":
                                  c.device || "",

                              "تاریخ نصب":
                                  c.install || "",

                              "آخرین تعویض فیلتر":
                                  c.filter || "",

                              "فیلتر 5و6":
                                  c.f56 || "",

                              "تاریخ بعدی":
                                  c.next || "",

                              "ممبران":
                                  c.membrane || "",

                              "ملاحظات":
                                  c.notes || "",

                              "بدهکاری":
                                  c.debt || ""
                          };
                      }
                  );


              const worksheet =
                  XLSX.utils.json_to_sheet(
                      rows
                  );


              const workbook =
                  XLSX.utils.book_new();


              XLSX.utils.book_append_sheet(
                  workbook,
                  worksheet,
                  "مشتریان"
              );


              XLSX.writeFile(
                  workbook,
                  "HakanNovin-Customers.xlsx"
              );


              showMessage(
                  "📤 فایل Excel ساخته شد."
              );
          }


          /*
           * =====================================================
           * CLEAR ALL
           * =====================================================
           */

          function clearCustomers(){

              if(!customers.length){

                  alert(
                      "لیست مشتریان خالی است."
                  );

                  return;
              }


              if(
                  !confirm(
                      "⚠️ همه مشتریان حذف شوند؟\n\nاین کار قابل برگشت نیست."
                  )
              ){
                  return;
              }


              customers=[];

              saveCustomers();

              render();

              showMessage(
                  "همه مشتریان حذف شدند."
              );
          }


          /*
           * =====================================================
           * START
           * =====================================================
           */

          loadCustomers();

          </script>

          </body>

          </html>
          EOF

      # ---------------------------------------------------------
      # Gradle
      # ---------------------------------------------------------
      - name: Install Gradle
        shell: bash
        run: |

          curl -L --fail \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip

          ./gradle-8.7/bin/gradle --version

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: Build APK
        shell: bash
        run: |

          ./gradle-8.7/bin/gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # Check
      # ---------------------------------------------------------
      - name: Check APK
        shell: bash
        run: |

          echo "APK files:"

          find app/build/outputs/apk/debug \
            -type f \
            -maxdepth 1 \
            -print

          test -f \
            app/build/outputs/apk/debug/app-debug.apk

          ls -lh \
            app/build/outputs/apk/debug/app-debug.apk

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: HakanNovin-APK-v3.2

          path:
            app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
