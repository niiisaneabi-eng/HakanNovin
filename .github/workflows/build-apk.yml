name: Build HakanNovin APK v3

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p hakan/app/src/main/java/com/hakannovin/app
          mkdir -p hakan/app/src/main/assets
          mkdir -p hakan/app/src/main/res/values

          cat > hakan/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HakanNovin"
          include(":app")
          EOF

          cat > hakan/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > hakan/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > hakan/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hakannovin.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.hakannovin.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName "3.0"
              }
          }
          EOF

          cat > hakan/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="هاکان نوین"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > hakan/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#0B7285</item>
                  <item name="android:navigationBarColor">#F5F8FA</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > hakan/app/src/main/java/com/hakannovin/app/MainActivity.java <<'EOF'
          package com.hakannovin.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.ValueCallback;
          import android.webkit.WebView;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {

              WebView web;
              ValueCallback<Uri[]> upload;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  web = new WebView(this);

                  web.setBackgroundColor(0xFFF5F8FA);

                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.getSettings().setAllowFileAccess(true);

                  web.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          upload = callback;

                          Intent i =
                                  new Intent(Intent.ACTION_OPEN_DOCUMENT);

                          i.addCategory(
                                  Intent.CATEGORY_OPENABLE);

                          i.setType("*/*");

                          i.putExtra(
                                  Intent.EXTRA_MIME_TYPES,
                                  new String[]{
                                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                                      "application/vnd.ms-excel"
                                  });

                          startActivityForResult(i, 44);

                          return true;
                      }
                  });

                  setContentView(web);

                  web.loadUrl(
                          "file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(
                      int request,
                      int result,
                      Intent data) {

                  super.onActivityResult(
                          request,
                          result,
                          data);

                  if (request == 44 && upload != null) {

                      Uri[] selected = null;

                      if (result == RESULT_OK &&
                          data != null &&
                          data.getData() != null) {

                          selected =
                                  new Uri[]{
                                      data.getData()
                                  };
                      }

                      upload.onReceiveValue(selected);
                      upload = null;
                  }
              }

              @Override
              public void onBackPressed() {

                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          wget -q \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            -O hakan/app/src/main/assets/xlsx.full.min.js

          cat > hakan/app/src/main/assets/index.html <<'EOF'
          <!doctype html>

          <html lang="fa" dir="rtl">

          <head>

          <meta charset="utf-8">

          <meta
              name="viewport"
              content="width=device-width,initial-scale=1">

          <title>هاکان نوین</title>

          <script src="xlsx.full.min.js"></script>

          <style>

          * {
              box-sizing:border-box;
          }

          body {
              margin:0;
              background:#f5f8fa;
              font-family:sans-serif;
              color:#18343b;
          }

          .top {
              background:
              linear-gradient(
                  135deg,
                  #087f8c,
                  #0b7285
              );

              color:white;

              padding:
              24px 18px 28px;

              border-radius:
              0 0 28px 28px;
          }

          .brand {
              display:flex;
              align-items:center;
              gap:12px;
          }

          .logo {
              width:58px;
              height:58px;

              border-radius:18px;

              background:white;

              display:grid;
              place-items:center;

              font-size:34px;
          }

          h1 {
              margin:0;
              font-size:26px;
          }

          .sub {
              opacity:.9;
              margin-top:5px;
              font-size:13px;
          }

          .wrap {
              padding:16px;
              max-width:650px;
              margin:auto;
          }

          .grid {
              display:grid;
              grid-template-columns:1fr 1fr;
              gap:12px;
              margin-top:-12px;
          }

          .card {
              background:white;
              border-radius:18px;
              padding:18px;

              box-shadow:
              0 6px 20px #00000010;
          }

          .num {
              font-size:28px;
              font-weight:800;
          }

          .lbl {
              font-size:13px;
              color:#668087;
          }

          button,
          .filebtn {

              width:100%;

              border:0;

              border-radius:15px;

              padding:15px;

              font-size:15px;

              font-weight:700;

              margin-top:10px;

              background:#0b7285;

              color:white;

              display:block;

              text-align:center;

              cursor:pointer;
          }

          .secondary {

              background:white;

              color:#0b7285;

              border:
              1px solid #d5e5e8;
          }

          .search {

              width:100%;

              padding:15px;

              border:
              1px solid #d5e5e8;

              border-radius:14px;

              font-size:15px;

              margin:12px 0;
          }

          .customer {

              background:white;

              border-radius:15px;

              padding:14px;

              margin:9px 0;

              box-shadow:
              0 3px 12px #00000008;
          }

          .name {

              font-weight:800;

              font-size:16px;
          }

          .meta {

              color:#60777d;

              font-size:13px;

              margin-top:5px;
          }

          .hidden {
              display:none;
          }

          .empty {

              text-align:center;

              color:#74888d;

              padding:35px;
          }

          .toast {

              position:fixed;

              bottom:18px;

              left:18px;

              right:18px;

              background:#18343b;

              color:white;

              padding:14px;

              border-radius:14px;

              text-align:center;

              display:none;
          }

          </style>

          </head>

          <body>

          <div class="top">

              <div class="brand">

                  <div class="logo">
                      💧
                  </div>

                  <div>

                      <h1>
                          هاکان نوین
                      </h1>

                      <div class="sub">
                          مدیریت مشتریان و خدمات تصفیه آب
                      </div>

                  </div>

              </div>

          </div>


          <div class="wrap">


              <div class="grid">

                  <div class="card">

                      <div
                          class="num"
                          id="count">
                          0
                      </div>

                      <div class="lbl">
                          کل مشتریان
                      </div>

                  </div>


                  <div class="card">

                      <div
                          class="num"
                          id="due">
                          0
                      </div>

                      <div class="lbl">
                          موعد سرویس
                      </div>

                  </div>

              </div>


              <label class="filebtn">

                  📊 ورود مشتریان از Excel

                  <input
                      id="file"
                      class="hidden"
                      type="file"
                      accept=".xlsx,.xls">

              </label>


              <button
                  class="secondary"
                  onclick="showList()">

                  👥 لیست مشتریان

              </button>


              <button
                  class="secondary"
                  onclick="addCustomer()">

                  ➕ مشتری جدید

              </button>


              <div id="panel"></div>


              <div
                  id="toast"
                  class="toast">
              </div>


          </div>


          <script>

          let customers =
              JSON.parse(
                  localStorage.getItem(
                      'hakanCustomers'
                  ) || '[]'
              );


          const save = () => {

              localStorage.setItem(
                  'hakanCustomers',
                  JSON.stringify(customers)
              );

              update();
          };


          const norm = s =>

              String(s ?? '')
              .replace(
                  /[\s\u200c\u200d\uFEFF]/g,
                  ''
              )
              .replace(
                  /[۰-۹]/g,
                  d =>
                      '۰۱۲۳۴۵۶۷۸۹'
                      .indexOf(d)
              );


          function headerMap(row) {

              let m = {};

              Object.keys(row).forEach(k => {

                  m[norm(k)] = k;

              });

              return m;
          }


          function val(row,m,names) {

              for (const n of names) {

                  if (
                      m[norm(n)] !== undefined
                  ) {

                      return row[
                          m[norm(n)]
                      ] ?? '';

                  }

              }

              return '';
          }


          function update() {

              document
                  .getElementById('count')
                  .textContent =
                  customers.length;


              document
                  .getElementById('due')
                  .textContent =
                  customers.filter(
                      x => x.nextDate
                  ).length;
          }


          function toast(t) {

              let e =
                  document.getElementById(
                      'toast'
                  );

              e.textContent = t;

              e.style.display = 'block';

              setTimeout(
                  () => {
                      e.style.display = 'none';
                  },
                  2500
              );
          }


          document
          .getElementById('file')
          .onchange = async e => {

              let f = e.target.files[0];

              if (!f) return;


              try {

                  let data =
                      await f.arrayBuffer();


                  let wb =
                      XLSX.read(
                          data,
                          {
                              type:'array',
                              cellDates:false
                          }
                      );


                  let ws =
                      wb.Sheets[
                          wb.SheetNames[0]
                      ];


                  let rows =
                      XLSX.utils.sheet_to_json(
                          ws,
                          {
                              defval:'',
                              raw:false
                          }
                      );


                  if (!rows.length) {

                      toast(
                          'فایل Excel خالی است'
                      );

                      return;
                  }


                  let imported =
                      rows.map(r => {

                          let m =
                              headerMap(r);


                          return {

                              name:
                              String(
                                  val(
                                      r,
                                      m,
                                      [
                                          'نام و نام خانوادگی',
                                          'نام'
                                      ]
                                  )
                              ).trim(),


                              installDate:
                              String(
                                  val(
                                      r,
                                      m,
                                      ['تاریخ نصب']
                                  )
                              ).trim(),


                              address:
                              String(
                                  val(
                                      r,
                                      m,
                                      ['آدرس']
                                  )
                              ).trim(),


                              phone:
                              String(
                                  val(
                                      r,
                                      m,
                                      [
                                          'شماره تماس',
                                          'تلفن',
                                          'شماره تلفن'
                                      ]
                                  )
                              ).trim(),


                              filterDate:
                              String(
                                  val(
                                      r,
                                      m,
                                      ['تعویض فیلتر']
                                  )
                              ).trim(),


                              filter56:
                              String(
                                  val(
                                      r,
                                      m,
                                      [
                                          'فیلتر 5و6',
                                          'فیلتر ۵ و ۶'
                                      ]
                                  )
                              ).trim(),


                              nextDate:
                              String(
                                  val(
                                      r,
                                      m,
                                      ['تاریخ بعدی']
                                  )
                              ).trim(),


                              device:
                              String(
                                  val(
                                      r,
                                      m,
                                      ['نوع دستگاه']
                                  )
                              ).trim(),


                              membrane:
                              String(
                                  val(
                                      r,
                                      m,
                                      ['ممبران']
                                  )
                              ).trim(),


                              notes:
                              String(
                                  val(
                                      r,
                                      m,
                                      ['ملاحظات']
                                  )
                              ).trim(),


                              debt:
                              String(
                                  val(
                                      r,
                                      m,
                                      ['بدهکاری']
                                  )
                              ).trim()

                          };

                      })
                      .filter(
                          x =>
                          x.name ||
                          x.phone
                      );


                  customers = imported;

                  save();

                  showList();

                  toast(
                      imported.length +
                      ' مشتری با موفقیت وارد شد'
                  );


              } catch(err) {

                  toast(
                      'خطا در خواندن Excel: ' +
                      err.message
                  );

              }


              e.target.value = '';

          };


          function showList() {

              let p =
                  document.getElementById(
                      'panel'
                  );


              p.innerHTML =

                  '<input id="q" class="search" ' +
                  'placeholder="جستجو با نام یا شماره...">' +

                  '<div id="list"></div>';


              let q =
                  document.getElementById('q');


              q.oninput = render;


              render();


              function render() {

                  let s =
                      q.value.trim();


                  let a =
                      customers.filter(
                          x =>
                          !s ||
                          x.name.includes(s) ||
                          x.phone.includes(s)
                      );


                  document
                  .getElementById('list')
                  .innerHTML =

                      a.length

                      ?

                      a.map(x =>

                          '<div class="customer" ' +
                          'onclick="detail(' +
                          customers.indexOf(x) +
                          ')">' +

                          '<div class="name">' +
                          esc(
                              x.name ||
                              'بدون نام'
                          ) +
                          '</div>' +

                          '<div class="meta">' +
                          '📞 ' +
                          esc(x.phone) +
                          ' · 💧 ' +
                          esc(x.device) +
                          '</div>' +

                          '<div class="meta">' +
                          '📅 سرویس بعدی: ' +
                          esc(
                              x.nextDate ||
                              'ثبت نشده'
                          ) +
                          '</div>' +

                          '</div>'

                      ).join('')

                      :

                      '<div class="empty">' +
                      'هنوز مشتری ثبت نشده' +
                      '</div>';
              }

          }


          function detail(i) {

              let x =
                  customers[i];


              document
              .getElementById('panel')
              .innerHTML =

                  '<div class="card">' +

                  '<h2>' +
                  esc(
                      x.name ||
                      'مشتری'
                  ) +
                  '</h2>' +

                  '<p>📞 ' +
                  esc(x.phone) +
                  '</p>' +

                  '<p>📍 ' +
                  esc(x.address) +
                  '</p>' +

                  '<p>💧 ' +
                  esc(x.device) +
                  '</p>' +

                  '<p>📅 نصب: ' +
                  esc(x.installDate) +
                  '</p>' +

                  '<p>🔧 تعویض فیلتر: ' +
                  esc(x.filterDate) +
                  '</p>' +

                  '<p>📅 سرویس بعدی: ' +
                  esc(x.nextDate) +
                  '</p>' +

                  '<p>فیلتر ۵ و ۶: ' +
                  esc(x.filter56) +
                  '</p>' +

                  '<p>ممبران: ' +
                  esc(x.membrane) +
                  '</p>' +

                  '<p>💰 بدهکاری: ' +
                  esc(x.debt) +
                  '</p>' +

                  '<p>📝 ' +
                  esc(x.notes) +
                  '</p>' +

                  '<button onclick="showList()">' +
                  '↩️ برگشت' +
                  '</button>' +

                  '</div>';
          }


          function addCustomer() {

              document
              .getElementById('panel')
              .innerHTML =

                  '<div class="card">' +

                  '<h2>مشتری جدید</h2>' +

                  '<input id="n" class="search" ' +
                  'placeholder="نام و نام خانوادگی">' +

                  '<input id="ph" class="search" ' +
                  'placeholder="شماره تماس">' +

                  '<input id="ad" class="search" ' +
                  'placeholder="آدرس">' +

                  '<input id="dev" class="search" ' +
                  'placeholder="نوع دستگاه">' +

                  '<button onclick="doAdd()">' +
                  'ثبت مشتری' +
                  '</button>' +

                  '<button class="secondary" ' +
                  'onclick="showList()">' +
                  'انصراف' +
                  '</button>' +

                  '</div>';
          }


          function doAdd() {

              let x = {

                  name:
                  document
                  .getElementById('n')
                  .value.trim(),

                  phone:
                  document
                  .getElementById('ph')
                  .value.trim(),

                  address:
                  document
                  .getElementById('ad')
                  .value.trim(),

                  device:
                  document
                  .getElementById('dev')
                  .value.trim(),

                  installDate:'',
                  filterDate:'',
                  filter56:'',
                  nextDate:'',
                  membrane:'',
                  notes:'',
                  debt:''
              };


              if (
                  !x.name &&
                  !x.phone
              ) {

                  toast(
                      'نام یا شماره را وارد کنید'
                  );

                  return;
              }


              customers.push(x);

              save();

              showList();

              toast(
                  'مشتری با موفقیت ثبت شد'
              );
          }


          function esc(s) {

              return String(
                  s ?? ''
              ).replace(
                  /[&<>"']/g,
                  c => ({
                      '&':'&amp;',
                      '<':'&lt;',
                      '>':'&gt;',
                      '"':'&quot;',
                      "'":'&#39;'
                  }[c])
              );
          }


          update();

          </script>

          </body>

          </html>
          EOF

          cd hakan

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip

          export PATH="$PWD/gradle-8.7/bin:$PATH"

          gradle wrapper --gradle-version 8.7

          ./gradlew assembleDebug


      - name: Check APK
        shell: bash
        run: |

          set -e

          echo "Checking APK..."

          test -f \
            hakan/app/build/outputs/apk/debug/app-debug.apk

          ls -lh \
            hakan/app/build/outputs/apk/debug/app-debug.apk

          echo "APK FOUND"


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: HakanNovin-APK-v3

          path:
            hakan/app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
